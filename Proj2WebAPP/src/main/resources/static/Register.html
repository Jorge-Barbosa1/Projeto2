<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Futebol | Registar</title>
    <style>
        .wrapper {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input, button {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .alert {
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <h2>Registar</h2>
    <form action="/register" method="post" th:action="@{/register}" th:object="${form}">
        <!-- <div th:if="${error}" class="alert" th:text="${error}">Erro de registro</div> -->
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" placeholder="Nome" required autofocus/>

        <label for="username">Nome do Utilizador</label>
        <input type="text" id="username" name="username" placeholder="Nome do Utilizador" required/>

        <label for="phone">Telefone</label>
        <input type="tel" id="phone" name="phone" placeholder="Telefone" required/>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" required/>

        <label for="password">Palavra-passe</label>
        <input type="password" id="password" name="password" placeholder="Palavra-passe" required/>

        <label for="confirmPassword">Confirmar Palavra-passe</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar Palavra-passe" required/>

        <button type="submit">Registar</button>
    </form>
</div>
</body>
</html>
