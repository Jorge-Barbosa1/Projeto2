<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Jogos</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<h1>Lista de Jogos</h1>
<table id="gamesTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Equipa1</th>
        <th> VS </th>
        <th>Equipa2</th>
        <!-- Adicione outras colunas conforme necessário -->
    </tr>
    </thead>
    <tbody>
    <!-- Os jogos serão inseridos aqui pelo JavaScript -->
    </tbody>
</table>

<script>
    // Função para carregar os jogos da API
    function loadGames() {
        fetch('/api/jogos')
            .then(response => response.json())
            .then(games => {
                console.log("Dados recebidos:", games); // Adiciona isso para ver no console do navegador
                const tableBody = document.getElementById('gamesTable').getElementsByTagName('tbody')[0];
                games.forEach(game => {
                    let row = tableBody.insertRow();
                    let cellIdGame = row.insertCell(0);
                    cellIdGame.innerHTML = game.idJogo;
                    let cellTeam1 = row.insertCell(1);
                    cellTeam1.innerHTML = game.idEquipa;
                    let cellVS = row.insertCell(2);
                    cellVS.innerHTML = "VS";
                    let cellTeam2 = row.insertCell(3);
                    cellTeam2.innerHTML = game.idEquipa2;
                });
            })
            .catch(error => console.error('Erro ao buscar jogos:', error));
    }

    window.onload = loadGames;

</script>
</body>
</html>
