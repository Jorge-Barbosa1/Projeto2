<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Jogos</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .button-container {
            margin-bottom: 20px;
        }
        .button-container button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="button-container">
    <button onclick="goBack()">Sair</button>
    <button onclick="window.location.href='/Favs.html'">Favoritos</button>
</div>
<h1>Lista de Jogos</h1>
<table id="gamesTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Equipa1</th>
        <th> VS </th>
        <th>Equipa2</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Campo</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    function loadGames() {
        fetch('/api/jogos')
            .then(response => response.json())
            .then(games => {
                console.log("Dados recebidos:", games);
                const tableBody = document.getElementById('gamesTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = ''; // Limpa o conteúdo anterior
                games.forEach(game => {
                    let row = tableBody.insertRow();
                    row.insertCell(0).innerHTML = game.idJogo;
                    row.insertCell(1).innerHTML = game.idEquipa;
                    row.insertCell(2).innerHTML = "VS";
                    row.insertCell(3).innerHTML = game.idEquipa2;
                    row.insertCell(4).innerHTML = game.data;
                    row.insertCell(5).innerHTML = game.hora;
                    row.insertCell(6).innerHTML = game.idCampo;
                });
            })
            .catch(error => console.error('Erro ao encontrar jogos:', error));
    }

    function goBack() {
        window.location.href='/Login.html';
    }

    window.onload = loadGames;
</script>
</body>
</html>
