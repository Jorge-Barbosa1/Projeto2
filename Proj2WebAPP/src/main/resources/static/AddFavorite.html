<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Favorito</title>
    <style>
        .form-container {
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .form-container select, .form-container button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Adicionar Jogador aos Favoritos</h2>
    <form id="adicionarJogadorForm">
        <label for="teams">Equipa:</label>
        <select id="teams" name="teams" required>
            <option value="">Selecione uma equipa</option>
        </select>
        <label for="players">Jogador:</label>
        <select id="players" name="players" required>
            <option value="">Selecione um jogador</option>
        </select>
        <button type="submit">Adicionar</button>
    </form>
    <button onclick="window.location.href='/Favs.html'">Voltar</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadTeams();
        document.getElementById('teams').addEventListener('change', loadPlayers);
        document.getElementById('adicionarJogadorForm').addEventListener('submit', function(event) {
            event.preventDefault();
            addFavorite();
        });
    });
    function loadTeams() {
        fetch('/api/teams')
            .then(response => response.json())
            .then(teams => {
                console.log('Equipas recebidas: ',teams)
                if(Array.isArray(teams)){
                    const teamsSelect = document.getElementById('teams');
                    teams.forEach(team => {
                        const option = document.createElement('option');
                        option.value = team.idEquipa;
                        option.textContent = team.nome;
                        teamsSelect.appendChild(option);
                    });
                }else{
                    console.log('Erro ao carregar equipas:',teams);
                }
            })
            .catch(error => console.error('Erro ao carregar equipes:', error));
    }

    function loadPlayers() {
        const teamId = document.getElementById('teams').value;
        if (teamId) {
            fetch(`/api/teams/${teamId}/players`)
                .then(response => response.json())
                .then(players => {
                    console.log('Jogadores recebidos:', players);
                    if(Array.isArray(players)){
                        const playersSelect = document.getElementById('players');
                        playersSelect.innerHTML = '<option value="">Selecione um jogador</option>';
                        players.forEach(player => {
                            const option = document.createElement('option');
                            option.value = player.idJogador;
                            option.textContent = player.nome;
                            playersSelect.appendChild(option);
                        });
                    }else{
                        console.error('Erro ao carregar jogadores:', players);
                    }
                })
                .catch(error => console.error('Erro ao carregar jogadores:', error));
        }
    }

    function addFavorite() {
        const teamSelected = document.getElementById('teams').value;
        const playerSelected = document.getElementById('players').value;
        const teamId = teamSelected.value;
        const teamName = teamSelected.options[teamSelected.selectedIndex].text;
        const playerId = playerSelected.value;
        const playerName = playerSelected.options[playerSelected.selectedIndex].text;

        const favorite = {
            idEquipa: teamId,
            nomeEquipa: teamName,
            idJogador: playerId,
            nomeJogador: playerName
        };

        fetch('/api/AddFav', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(favorite)
        })
            .then(response => {
                if (response.ok) {
                    alert('Jogador adicionado aos favoritos com sucesso!');
                } else {
                    alert('Erro ao adicionar jogador aos favoritos.');
                }
            })
            .catch(error => {
                console.error('Erro ao adicionar jogador:', error);
                alert('Erro ao adicionar jogador aos favoritos.');
            });
    }
</script>
</body>
</html>
