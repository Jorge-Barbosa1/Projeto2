<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Zero | Registar</title>
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
    <style>
      
        .wrapper {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .registar {
            display: flex;
            flex-direction: column;
        }
        .registar input {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .registar button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .registar button:hover {
            background-color: #218838;
        }
        .alert {
            color: red;
            margin-bottom: 10px;
        }
    </style>
    <script>
        // Função para redirecionar após o registro
        function redirecionarParaLogin(event) {
            event.preventDefault(); // Impede o envio do formulário
            var form = document.getElementById("registarForm");
            var formData = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: formData
            }).then(response => {
                if (response.ok) {
                    window.location.href = 'Login.html'; // Redireciona para a página de login
                } else {
                    alert("Ocorreu um erro ao registrar. Tente novamente.");
                }
            }).catch(error => {
                console.error("Erro:", error);
                alert("Ocorreu um erro ao registrar. Tente novamente.");
            });
        }
    </script>
</head>
<body>
<div class="wrapper">
    <form class="registar" id="registarForm" action="/logger" method="post" onsubmit="redirecionarParaLogin(event)">
        <p class="title">Registar</p>

        <label for="username">Nome de Usuário</label>
        <input type="text" id="username" name="username" placeholder="Nome de Usuário" required autofocus/>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" required/>

        <label for="contactos">Contacto</label>
        <input type="text" id="contactos" name="contactos" placeholder="Contacto" required/>

        <label for="password">Palavra-passe</label>
        <input type="password" id="password" name="password" placeholder="Palavra-passe" required/>

        <div th:if="${erro} != null" th:text="${erro}" class="alert alert-danger" role="alert"></div>

        <button type="submit">
            <i class="spinner"></i>
            <span class="state">Registar</span>
        </button>
    </form>
</div>
</body>
</html>
