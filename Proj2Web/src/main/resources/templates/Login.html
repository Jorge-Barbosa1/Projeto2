<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Conserveira | Log in</title>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
    <link rel="stylesheet" href="./css/stylelogin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>

    <style>
        /* Adicione alguns estilos básicos */
        .wrapper {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .log.in {
            display: flex;
            flex-direction: column;
        }
        .log.in input {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .log.in button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .log.in button:hover {
            background-color: #218838;
        }
        .alert {
            color: red;
            margin-bottom: 10px;
        }
    </style>
    <script>
        async function handleLogin(event) {
            event.preventDefault(); // Impede o envio do formulário
            var form = document.getElementById("loginForm");
            var formData = new FormData(form);

            try {
                let response = await fetch(form.action, {
                    method: form.method,
                    body: formData
                });

                if (response.ok) {
                    window.location.href = 'home.html'; // Redireciona para a página inicial ou outra página desejada
                } else {
                    let errorText = await response.text();
                    alert("Ocorreu um erro ao fazer login: " + errorText);
                }
            } catch (error) {
                console.error("Erro:", error);
                alert("Ocorreu um erro ao fazer login. Tente novamente.");
            }
        }
    </script>
</head>
<body>
<div class="wrapper">
    <form class="log in" id="loginForm" action="/logger" method="post" onsubmit="handleLogin(event)">
        <p class="title">Log in</p>

        <label for="username">Nome de Usuário</label>
        <input type="text" id="username" name="username" placeholder="Nome de Usuário" required autofocus/>
        <i class="fa fa-user"></i>

        <label for="password">Palavra-passe</label>
        <input type="password" id="password" name="password" placeholder="Palavra-passe" required/>
        <i class="fa fa-key"></i>

        <div th:if="${erro} != null" th:text="${erro}" class="alert alert-danger" role="alert"></div>

        <button type="submit">
            <i class="spinner"></i>
            <span class="state">Log in</span>
        </button>
    </form>
</div>
</body>
</html>
